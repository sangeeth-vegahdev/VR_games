<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="data:," />
    <title>VR Games Hub - Central VR Lobby</title>
    <style>
      body { margin: 0; background: #000; overflow: hidden; user-select: none; }
      #visor { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>

    <!-- The PC view is framed as the view through the headset. Hidden in a headset (see src/visor.js). -->
    <svg id="visor" viewBox="0 0 757 502" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <defs>
        <linearGradient id="visor-shell" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="430">
          <stop offset="0" stop-color="#060607" />
          <stop offset="0.05" stop-color="#232325" />
          <stop offset="0.11" stop-color="#17171a" />
          <stop offset="0.18" stop-color="#090909" />
          <stop offset="0.8" stop-color="#090909" />
          <stop offset="0.88" stop-color="#0d0d0e" />
          <stop offset="0.93" stop-color="#0a0a0b" />
          <stop offset="1" stop-color="#090909" />
        </linearGradient>
        <filter id="sheen-blur" x="-5%" y="-50%" width="110%" height="200%"><feGaussianBlur stdDeviation="3" /></filter>
      </defs>

      <!-- The shell, with the opening cut out of it. -->
      <path
        fill="url(#visor-shell)"
        fill-rule="evenodd"
        d="M-4000 -4000 H4757 V4000 H-4000 Z
           M52 76 C160 64 596 64 705 76 C728 79 738 96 738 122 L738 300 C738 334 724 354 692 362 C640 376 570 374 500 362 C450 354 410 350 378 350 C346 350 306 354 256 362 C186 374 116 376 65 362 C33 354 19 334 19 300 L19 122 C19 96 29 79 52 76 Z"
      />
      <!-- Soft light along the top and bottom of the shell, and the dark bevel into the opening. -->
      <g fill="none" filter="url(#sheen-blur)">
        <path stroke="#ffffff" stroke-opacity="0.13" stroke-width="7" d="M-20 58 C60 22 696 22 777 58" />
      </g>
      <path fill="none" stroke="#000000" stroke-width="3" d="M52 76 C160 64 596 64 705 76 C728 79 738 96 738 122 L738 300 C738 334 724 354 692 362 C640 376 570 374 500 362 C450 354 410 350 378 350 C346 350 306 354 256 362 C186 374 116 376 65 362 C33 354 19 334 19 300 L19 122 C19 96 29 79 52 76 Z" />
    </svg>

    <script type="module" src="/src/index.js"></script>
  
    <!-- Floating IWSDK Device Switcher (Meta Quest 3 vs Meta Quest Pro) -->
    <div id="iwsdk-device-switcher" style="position:fixed;bottom:16px;left:16px;z-index:999999;display:flex;align-items:center;gap:8px;background:rgba(15,23,42,0.92);backdrop-filter:blur(10px);padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);font-family:system-ui,-apple-system,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,0.6);">
      <span style="color:#94a3b8;font-size:11px;font-weight:700;letter-spacing:0.5px;">EMULATOR:</span>
      <button id="dev-btn-q3" onclick="setEmulatorDevice('metaQuest3')" style="padding:6px 12px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid transparent;cursor:pointer;background:#1e293b;color:#94a3b8;transition:all 0.2s;">🥽 Meta Quest 3</button>
      <button id="dev-btn-pro" onclick="setEmulatorDevice('metaQuestPro')" style="padding:6px 12px;font-size:12px;font-weight:600;border-radius:8px;border:1px solid transparent;cursor:pointer;background:#1e293b;color:#94a3b8;transition:all 0.2s;">👁️ Meta Quest Pro (Eye Gaze)</button>
    </div>
    <script>
      function setEmulatorDevice(dev) {
        localStorage.setItem('iwsdk:device', dev);
        const url = new URL(window.location.href);
        url.searchParams.set('device', dev);
        window.location.href = url.toString();
      }
      (function() {
        const cur = new URL(window.location.href).searchParams.get('device') || localStorage.getItem('iwsdk:device') || 'metaQuestPro';
        const q3Btn = document.getElementById('dev-btn-q3');
        const proBtn = document.getElementById('dev-btn-pro');
        if (cur === 'metaQuest3') {
          if (q3Btn) { q3Btn.style.background = '#2563eb'; q3Btn.style.color = '#ffffff'; q3Btn.style.borderColor = '#60a5fa'; }
        } else {
          if (proBtn) { proBtn.style.background = '#0ea5e9'; proBtn.style.color = '#ffffff'; proBtn.style.borderColor = '#38bdf8'; }
        }
      })();
    </script>

  </body>
</html>
