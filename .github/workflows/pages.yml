# Builds both games and publishes them to GitHub Pages (HTTPS, which WebXR requires):
#   Cricket Catch      at  https://<user>.github.io/<repo>/
#   Glove Up (baseball) at https://<user>.github.io/<repo>/baseball/
# One-time setup: repo Settings > Pages > Build and deployment > Source: "GitHub Actions".
# It runs when either game changes on main, or by hand from the Actions tab.
name: Deploy the games to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'cricket-xr/**'
      - 'baseball-xr/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cricket-xr/package-lock.json
            baseball-xr/package-lock.json
      - name: Build Cricket Catch
        working-directory: cricket-xr
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Build Glove Up (baseball)
        working-directory: baseball-xr
        run: |
          npm ci --ignore-scripts
          npm run build
      # Both builds use relative paths (vite base './'), so the baseball game works from a sub-folder.
      - name: Put the baseball game under /baseball/
        run: cp -r baseball-xr/dist cricket-xr/dist/baseball
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cricket-xr/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
